<!DOCTYPE html>
<html>
<head>
  <title>Wave {{ wave_num }} — Choose Your Team</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='kiai-readability.css') }}">
  <style>
    body { font-family: sans-serif; max-width: 1200px; margin: 40px auto; padding: 0 20px; background-image: url('/static/battle_background.png'); background-size: cover; background-attachment: fixed; background-repeat: no-repeat; }
    h2 { color: white; text-shadow: var(--kiai-text-on-bg-lg); }
    p { color: white; text-shadow: var(--kiai-text-on-bg); }
    .species-grid { display: flex; flex-wrap: wrap; gap: 16px; margin: 20px 0; justify-content: center; }
    .game-page-main {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }
    .game-page-main > .score-bar,
    .game-page-main > h2,
    .game-page-main > p {
      width: 100%;
      text-align: center;
    }
    .game-page-main form {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }
    .team-picker {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      width: fit-content;
      max-width: 100%;
      margin: 0 auto;
    }
    .team-picker .species-grid {
      justify-content: flex-start;
      max-width: 100%;
    }
    .game-page-main form .btn {
      padding: 16px 44px;
      font-size: 1.2em;
      border-radius: 8px;
      margin-top: 20px;
    }
    .species-card {
      border: 2px solid #ccc; border-radius: 8px; padding: 16px; width: 275px;
      cursor: pointer; transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s; background: white;
      box-shadow: var(--kiai-shadow-card);
    }
    .species-card:hover { box-shadow: var(--kiai-shadow-card-hover); transform: translateY(-2px); }
    .species-card:has(input:checked) { border-color: #2d6a4f; background: #f0faf4; }
    .species-card input { margin-right: 8px; }
    .species-name {
      font-size: 1.1em; font-weight: bold;
    }
    .species-name a { color: #1b4332; }
    .species-name a:hover { color: #2d6a4f; }
    .species-common {
      font-size: 0.78em; color: #444; margin-top: 4px; line-height: 1.35;
    }
    .species-scientific {
      font-size: 0.78em; font-style: italic; color: #666; margin-top: 4px;
    }
    .species-thumb {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 6px;
      margin: 8px 0;
      display: block;
      background: #eee;
    }
    .species-stats { font-size: 0.85em; color: #555; margin: 6px 0; }
    .traits { font-size: 0.78em; margin: 6px 0 4px; line-height: 1.6; }
    .traits .strong { color: #1b7c3e; }
    .traits .weak { color: #b03a2e; }
    .moves-list { font-size: 0.8em; margin-top: 8px; padding-left: 0; list-style: none; }
    .moves-list li { padding: 3px 0; color: #333; }
    .move-cost { color: #888; }
    .btn {
      background: #2d6a4f; color: white; border: none; padding: 12px 28px;
      font-size: 1em; border-radius: 6px; cursor: pointer; margin-top: 16px;
      box-shadow: var(--kiai-shadow-btn);
    }
    .btn:hover { background: #1b4332; box-shadow: var(--kiai-shadow-btn-hover); }
    .score-bar { color: white; text-shadow: var(--kiai-text-on-bg); margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="page-title-wrap">
    <img src="{{ url_for('static', filename='title.png') }}" alt="Kia'i 'Aina">
  </div>
  <div class="game-page-main">
  <div class="score-bar page-title-overlap">Wave {{ wave_num }} &nbsp;|&nbsp; Score: {{ score }}</div>
  <h2>Choose {{ team_size }} Defenders</h2>
  <p>Pick up to {{ team_size }} native birds for this wave. Consider HP, moves, and strengths & weaknesses.</p>

  <form action="/battle/start" method="post">
    <div class="team-picker">
    <div class="species-grid">
      {% for s in natives %}
      <label class="species-card">
        <div>
          <input type="checkbox" name="natives" value="{{ s.name }}" onclick="enforceLimit(this)">
          <span class="species-name">
            {% if s.profile_url %}
            <a href="{{ s.profile_url }}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation();">{{ s.display_name }}</a>
            {% else %}
            {{ s.display_name }}
            {% endif %}
          </span>
        </div>
        {% if s.common_line %}
        <div class="species-common">{{ s.common_line }}</div>
        {% endif %}
        {% if s.scientific %}
        <div class="species-scientific">{{ s.scientific }}</div>
        {% endif %}
        {% if s.image_url %}
        <img class="species-thumb" src="{{ s.image_url }}" alt="">
        {% endif %}
        <div class="species-stats">
          HP: {{ s.health }} &nbsp;|&nbsp; ATK: {{ s.attack }}
        </div>
        <div class="traits">
          <span class="strong">💪 Strong vs: {{ s.strong_against | join(', ') }}</span><br>
          <span class="weak">⚠️ Weak to: {{ s.weak_to | join(', ') }}</span>
        </div>
        <ul class="moves-list">
          {% for m in s.moves %}
          <li>⚡{{ m.energy_cost }} &nbsp;<strong>{{ m.name }}</strong> &nbsp;<span class="move-cost">({{ m.damage }} dmg)</span></li>
          {% endfor %}
        </ul>
      </label>
      {% endfor %}
    </div>
    <button class="btn" type="submit">Go to Battle</button>
    </div>
  </form>
  </div>

  <script>
    const MAX = {{ team_size }};
    function enforceLimit(changed) {
      const boxes = document.querySelectorAll('input[name="natives"]');
      const checked = Array.from(boxes).filter(b => b.checked);
      if (checked.length > MAX) {
        changed.checked = false;
      }
    }
  </script>
</body>
</html>
