<!DOCTYPE html>
<html>
<head>
    <title>Kiai Aina</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-image: url('{{ bg_pic }}');
            background-size: cover;
            background-attachment: fixed;
            background-repeat: no-repeat;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }
        
        .wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
        }
        
        .title-container {
            display: flex;
            justify-content: center;
            width: 90%;
            max-width: 700px;
            margin-bottom: 0;
        }
        
        .title-container img {
            max-width: 100%;
            width: 100%;
            height: auto;
            display: block;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.5));
        }
        
        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 90%;
            max-width: 600px;
            margin-top: 0;
        }
        
        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .menu-btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: bold;
            color: white;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3), inset 0 -3px 0 rgba(0, 0, 0, 0.3);
            min-height: 55px;
        }
        
        .menu-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4), inset 0 -3px 0 rgba(0, 0, 0, 0.3);
        }
        
        .menu-btn:active {
            transform: translateY(0);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.4);
        }
        
        .start-game {
            background: linear-gradient(180deg, #4a9c3e, #2d5016);
        }
        
        .compendium-btn {
            background: linear-gradient(180deg, #3b82f6, #1e40af);
        }
        
        .difficulty-btn {
            background: linear-gradient(180deg, #a855f7, #7e22ce);
        }
        
        .leaderboard-btn {
            background: linear-gradient(180deg, #f59e0b, #d97706);
        }
        
        .menu-btn-icon {
            position: absolute;
            left: 20px;
            font-size: 1.5em;
            min-width: 30px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="title-container">
            <img src="{{ title_pic }}" alt="Kia'i 'Aina">
        </div>
        
        <div class="menu-container">
            <form action="/start" method="post">
                <button type="submit" class="menu-btn start-game">
                    <span class="menu-btn-icon">🌿</span>
                    <span>Start Game</span>
                </button>
            </form>
            <a href="/difficulty" style="text-decoration: none; width: 100%;">
                <button type="button" class="menu-btn difficulty-btn" style="width: 100%;">
                    <span class="menu-btn-icon">⚙️</span>
                    <span>Difficulty Select</span>
                </button>
            </a>
            <a href="/leaderboard" style="text-decoration: none; width: 100%;">
                <button type="button" class="menu-btn leaderboard-btn" style="width: 100%;">
                    <span class="menu-btn-icon">🏆</span>
                    <span>Leaderboard</span>
                </button>
            </a>
            <a href="/compendium" style="text-decoration: none; width: 100%;">
                <button type="button" class="menu-btn compendium-btn" style="width: 100%;">
                    <span class="menu-btn-icon">📖</span>
                    <span>Species Compendium</span>
                </button>
            </a>
        </div>
    </div>
</body>
</html>
